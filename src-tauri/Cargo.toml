[package]
name = "mooncraft-launcher"
version = "0.2.0"
description = "MoonCraft Launcher — premium space-themed Minecraft launcher"
authors = ["MoonCraft Team"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "mooncraft_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
# Auto-update du launcher lui-même (mise à jour depuis les Releases GitHub)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "gzip",
    "brotli",
    "multipart",
] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Filesystem
dirs = "5"
walkdir = "2"
zip = "0.6"

# Errors
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
which = "6"
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
