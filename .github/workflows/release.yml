name: Release Launcher

# Pousse un tag (ex: git tag v0.2.0 && git push --tags) -> build signé + release
# GitHub avec l'installeur et latest.json. Les launchers déjà installés détectent
# la nouvelle version et se mettent à jour automatiquement (Tauri updater).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build, sign & publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secrets à ajouter dans le repo (Settings > Secrets > Actions) :
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MoonCraft Launcher ${{ github.ref_name }}"
          releaseBody: "Mise à jour automatique du launcher Moon Craft."
          releaseDraft: false
          prerelease: false
